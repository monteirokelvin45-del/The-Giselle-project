; Export presets — A Academia do Zero
;
; ⚠️  Este preset está pré-configurado mas NÃO foi validado por uma exportação
; real (este ambiente não tem Android SDK/JDK nem Godot). Antes do primeiro
; export na tua máquina:
;   1. Godot → Editar → Preferências → Editor → Exportar → Android:
;      configurar JAVA_HOME e o caminho do Android SDK; o Godot gera a
;      keystore de debug automaticamente.
;   2. Projeto → Exportar → selecionar "Android" e verificar este preset
;      (ícones, package id) — quaisquer avisos do Godot mandam no que estiver aqui.
;   3. Para release: criar keystore própria (keytool) e preencher as chaves
;      keystore/* aqui (NUNCA commitar a keystore nem passwords).
;
[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.2.0"
package/unique_name="com.thegiselleproject.academiazero"
package/name="A Academia do Zero"
package/signed=true
min_sdk="24"
target_sdk=""
launcher_icons/main_192x192="res://assets/art/icons/icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/art/icons/icon_512.png"
launcher_icons/adaptive_background_432x432="res://assets/art/icons/adaptive_bg_1024.png"
launcher_icons/monochrome_432x432="res://assets/art/icons/icon_512.png"
xr/enable=false
screen/immersive_mode=true
screen/edge_to_edge=true
permissions/internet=false
permissions/access_network_state=false
permissions/access_wifi_state=false
permissions/wake_lock=true
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""

